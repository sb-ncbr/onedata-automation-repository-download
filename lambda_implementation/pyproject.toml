[project]
name = "repository-download"
version = "0.1.0"
description = "Onedata Automation lambda downloading a dataset from an Invenio-based repository (by DOI) into an Onedata directory"
requires-python = ">=3.12"
dependencies = [
    "onedata-lambda-sdk>=1.0",
    "requests>=2.32",
]

[project.entry-points."onedata.lambda"]
handler = "repository_download.handler:handle"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repository_download"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
